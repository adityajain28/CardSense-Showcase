name: Capture live CardSense screenshots

on:
  push:
    paths:
      - '.github/workflows/capture-live.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser API
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright-core
          CHROME_PATH="$(which google-chrome || which google-chrome-stable || which chromium || which chromium-browser)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Capture recruiter-facing screens from live deployment
        env:
          LIVE_URL: https://cardsense-27fu.onrender.com
        run: |
          mkdir -p assets
          cat > capture.js <<'NODE'
          const { chromium } = require('playwright-core');
          const LIVE_URL = process.env.LIVE_URL;

          async function shot(page, route, path) {
            await page.goto(`${LIVE_URL}${route}`, { waitUntil: 'domcontentloaded', timeout: 90000 });
            await page.waitForTimeout(2500);
            await page.screenshot({ path, fullPage: true });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROME_PATH });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 980 },
              deviceScaleFactor: 1.25,
            });
            const page = await context.newPage();

            // Create a temporary showcase account on the real deployed app.
            await page.goto(`${LIVE_URL}/register`, { waitUntil: 'domcontentloaded', timeout: 90000 });
            const username = `showcase_${Date.now().toString().slice(-10)}`;
            const password = `Portfolio!${Date.now()}Aa`;
            await page.fill('#username', username);
            await page.fill('#password', password);
            await page.fill('#confirm_password', password);
            await Promise.all([
              page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 90000 }),
              page.getByRole('button', { name: 'Create account' }).click(),
            ]);

            // Seed a clean, fictional portfolio through the app's authenticated APIs.
            async function post(path, body) {
              const result = await page.evaluate(async ({ path, body }) => {
                const r = await fetch(path, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(body),
                });
                return { status: r.status, text: await r.text() };
              }, { path, body });
              if (result.status >= 400) console.log(path, result.status, result.text);
              return result;
            }

            await post('/api/add-card', {
              issuer: 'chase', product_name: 'sapphire_reserve',
              display_name: 'Travel Reserve', opened_date: '2024-06'
            });
            await post('/api/add-card', {
              issuer: 'amex', product_name: 'platinum',
              display_name: 'Premium Travel', opened_date: '2023-11'
            });
            await post('/api/add-card', {
              issuer: 'amex', product_name: 'gold',
              display_name: 'Dining Rewards', opened_date: '2025-02'
            });
            await post('/api/add-points', {
              issuer: 'Chase', program: 'Ultimate Rewards', balance: 128450, expiring_points: 0
            });
            await post('/api/add-points', {
              issuer: 'American Express', program: 'Membership Rewards', balance: 94200, expiring_points: 0
            });

            // Capture the screens that best explain the product to a recruiter.
            await shot(page, '/hub.html', 'assets/live-dashboard.png');
            await shot(page, '/benefits.html', 'assets/live-benefits.png');
            await shot(page, '/strategy.html', 'assets/live-strategy.png');
            await shot(page, '/insights.html', 'assets/live-insights.png');

            await browser.close();
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE
          node capture.js

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/live-dashboard.png assets/live-benefits.png assets/live-strategy.png assets/live-insights.png
          git commit -m "Refresh screenshots from live CardSense deployment [skip ci]" || exit 0
          git push
